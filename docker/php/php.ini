; ── Performance ──────────────────────────────
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
upload_max_filesize = 50M
post_max_size = 50M

; ── Error handling (production) ──────────────
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ── Date ─────────────────────────────────────
date.timezone = UTC
